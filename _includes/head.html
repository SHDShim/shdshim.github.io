<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title and page.title != site.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link
  href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap"
  rel="stylesheet"
>
<link rel="icon" href="{{ '/assets/favicon-planet.svg' | relative_url }}" type="image/svg+xml">
{% assign stylesheet_version = '20260329-space-resources-spacing' %}
{% if page.nav_key == 'home' %}
  {% assign stylesheet_version = '20260329-space' %}
{% endif %}
<link rel="stylesheet" href="{{ '/styles.css?v=' | append: stylesheet_version | relative_url }}">
